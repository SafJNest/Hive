name: Verify Hive

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0-alpha-1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
